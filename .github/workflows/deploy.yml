name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Fix npmDepsHash in flake.nix
        run: |
          CORRECT_HASH=$(nix run nixpkgs#prefetch-npm-deps -- package-lock.json)
          echo "Computed hash: $CORRECT_HASH"
          sed -i "s|npmDepsHash = \"[^\"]*\"|npmDepsHash = \"$CORRECT_HASH\"|" flake.nix
          grep npmDepsHash flake.nix

      - name: Build
        run: |
          nix develop --command sh -c "npm ci && npm run build"
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
