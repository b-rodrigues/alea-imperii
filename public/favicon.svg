<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle matching the bronze-wood/parchment theme -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1500" />
      <stop offset="50%" stop-color="#161310" />
      <stop offset="100%" stop-color="#0b0a08" />
    </linearGradient>
    <linearGradient id="bronze-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c4f10" />
      <stop offset="40%" stop-color="#c8803f" />
      <stop offset="70%" stop-color="#ffb77b" />
      <stop offset="100%" stop-color="#ffdcc2" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ffb77b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" stroke="url(#bronze-grad)" stroke-width="6" />

  <g filter="url(#glow)" fill="url(#bronze-grad)">
    <!-- Pediment (Triangular Roof) -->
    <polygon points="256,110 90,195 422,195" />
    <!-- Pediment Inner Trim -->
    <polygon points="256,132 120,185 392,185" fill="#2e1500" opacity="0.6"/>

    <!-- Architrave / Frieze (Horizontal beam under roof) -->
    <rect x="110" y="200" width="292" height="24" rx="2" />
    <!-- Small details on the architrave / triglyphs -->
    <rect x="120" y="228" width="272" height="8" rx="1" fill="#2d1500" opacity="0.3" />

    <!-- 4 Majestic Columns -->
    <!-- Column 1 (Leftmost) -->
    <path d="M 140,232 L 156,232 L 156,380 L 140,380 Z" />
    <rect x="134" y="228" width="28" height="6" rx="1" />
    <rect x="134" y="378" width="28" height="6" rx="1" />

    <!-- Column 2 -->
    <path d="M 210,232 L 226,232 L 226,380 L 210,380 Z" />
    <rect x="204" y="228" width="28" height="6" rx="1" />
    <rect x="204" y="378" width="28" height="6" rx="1" />

    <!-- Column 3 -->
    <path d="M 286,232 L 302,232 L 302,380 L 286,380 Z" />
    <rect x="280" y="228" width="28" height="6" rx="1" />
    <rect x="280" y="378" width="28" height="6" rx="1" />

    <!-- Column 4 (Rightmost) -->
    <path d="M 356,232 L 372,232 L 372,380 L 356,380 Z" />
    <rect x="350" y="228" width="28" height="6" rx="1" />
    <rect x="350" y="378" width="28" height="6" rx="1" />

    <!-- Stylobate (Stepped Foundation Base) -->
    <!-- Bottom Step -->
    <rect x="100" y="386" width="312" height="15" rx="2" />
    <!-- Middle Step -->
    <rect x="80" y="403" width="352" height="18" rx="2" />
    <!-- Top Step -->
    <rect x="60" y="423" width="392" height="21" rx="2" />
  </g>
</svg>
